name: CraftPdf Windows build

# Builds the Windows portable zip on every push to main and publishes it as the "latest" release:
# https://github.com/<owner>/<repo>/releases/latest/download/CraftPdf-windows-x64.zip
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: craftpdf-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # Static C runtime: no Visual C++ redistributable needed (as upstream's package.ps1).
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
      # Build speed over the last few % of runtime speed: upstream's release profile (thin LTO,
      # one codegen unit) compiles the biggest crates on a single core of the 4-core runner.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: craftpdf-windows

      - name: Build
        run: cargo build --release --locked -p pdfcraft --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'dist\CraftPdf'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'target\x86_64-pc-windows-msvc\release\pdfcraft.exe' $stage
          foreach ($f in 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'packaging\windows\portable.txt', 'assets\app-icon\LICENSE-document.txt') {
            Copy-Item $f $stage
          }
          Copy-Item 'packaging\craftpdf\*.bat' $stage
          # OCR models (Recognize Text) go in models\ beside pdfcraft.exe.
          New-Item -ItemType Directory -Force -Path "$stage\models" | Out-Null
          cargo xtask models "$stage\models"
          if ($LASTEXITCODE -ne 0) { throw "cargo xtask models failed ($LASTEXITCODE)" }
          Remove-Item -Force "$stage\models\*.part" -ErrorAction SilentlyContinue
          @"
          CraftPdf - based on PdfCraft by the ArtCraft team (https://github.com/storytold/pdfcraft).
          Not an official ArtCraft build.

          Run pdfcraft.exe. Edit a scanned page in Paint: right-click the page > "Edit page in Paint".
          Each Ctrl+S in Paint updates the page here (Ctrl+Z undoes it). Save the PDF when done.
          Another editor: set the CRAFTPDF_IMAGE_EDITOR environment variable to its .exe.
          "@ | Set-Content "$stage\README-CraftPdf.txt"
          Compress-Archive -Path $stage -DestinationPath 'dist\CraftPdf-windows-x64.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: CraftPdf-windows-x64
          path: dist/CraftPdf-windows-x64.zip

      - name: Publish as the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/CraftPdf-windows-x64.zip \
            --target "$GITHUB_SHA" \
            --title "CraftPdf (build ${{ github.run_number }})" \
            --notes "Windows portable build of ${GITHUB_SHA::7}. Unzip, run pdfcraft.exe. Unsigned: Windows SmartScreen asks once (More info > Run anyway)."
